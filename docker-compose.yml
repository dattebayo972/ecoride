version: '3.8'

services:

  # ── Application PHP/Apache ─────────────────────────────
  app:
    build: .
    container_name: ecoride_app
    ports:
      - "8080:80"
    environment:
      DB_HOST: mysql
      DB_NAME: ecoride
      DB_USER: ecoride_user
      DB_PASS: ecoride_pass
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ecoride
      APP_URL: http://localhost:8080
      APP_ENV: development
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
    volumes:
      - .:/var/www/html

  # ── Base de données MySQL 8.0 ──────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ecoride_mysql
    environment:
      MYSQL_DATABASE: ecoride
      MYSQL_USER: ecoride_user
      MYSQL_PASSWORD: ecoride_pass
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
      - ./sql/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Base de données MongoDB 6 ──────────────────────────
  mongo:
    image: mongo:6.0
    container_name: ecoride_mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
